<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Form GET</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f4f7fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 1.5rem;
    }
    .form-card {
      background: #ffffff;
      padding: 2.25rem 2rem 2rem;
      border-radius: 24px;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.15), 0 8px 16px -6px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 420px;
      transition: transform 0.2s ease;
    }
    .form-card:hover {
      transform: scale(1.01);
    }
    h2 {
      font-weight: 600;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
      color: #0a1e2f;
      margin-top: 0;
      margin-bottom: 1.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    h2::before {
      content: "📋";
      font-size: 1.8rem;
      font-weight: 400;
    }
    .input-group {
      margin-bottom: 1.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    label {
      font-weight: 500;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #2c4b66;
      padding-left: 0.25rem;
    }
    input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      border: 2px solid #dbe4ee;
      border-radius: 18px;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    input:focus {
      border-color: #2a6df4;
      box-shadow: 0 0 0 4px rgba(42, 109, 244, 0.15);
    }
    input::placeholder {
      color: #a0b5cc;
      font-weight: 400;
    }
    button {
      width: 100%;
      padding: 1rem 1.5rem;
      margin-top: 1rem;
      background: #1b2e41;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 8px 18px -6px rgba(20, 40, 70, 0.3);
      letter-spacing: 0.3px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
    }
    button:hover {
      background: #11212e;
      box-shadow: 0 12px 22px -8px rgba(20, 40, 70, 0.4);
    }
    button:active {
      transform: scale(0.98);
      box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.3);
    }
    /* tiny decorative line */
    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, #cbdae9, transparent);
      margin: 0.25rem 0 1.2rem;
    }
  </style>
</head>
<body>
  <form class="form-card" method="get">
    <h2>Get form</h2>
    <div class="divider"></div>

    <!-- Input 1 -->
    <div class="input-group">
      <label for="value1">First value</label>
      <input type="number" id="value1" name="num1" placeholder="e.g. 12" autocomplete="off" required>
    </div>

    <!-- Input 2 -->
    <div class="input-group">
      <label for="value2">Second value</label>
      <input type="number" id="value2" name="num2" placeholder="e.g. 8" autocomplete="off" required>
    </div>

    <!-- Submit button -->
    <button type="submit">
      <span>Submit</span>
      <span style="font-size: 1.2rem;">→</span>
    </button>
    <div >
      <label for="value2">Output</label>
      <input type='text' value="{{output}}"/>
    </div>

  </form>
</body>
</html>
